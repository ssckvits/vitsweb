<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ADMIN Panel | BOTB</title>
  <link rel="shortcut icon" href="/img/admin.png" type="image/x-icon">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <section id="login-sec">
        
    <form action="" class="form_main">
        <div class="glass-card"></div>
        <p class="heading">LOGIN</p>
        <div class="inputContainer">
            <svg class="inputIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#2e2e2e" viewBox="0 0 16 16">
            <path d="M13.106 7.222c0-2.967-2.249-5.032-5.482-5.032-3.35 0-5.646 2.318-5.646 5.702 0 3.493 2.235 5.708 5.762 5.708.862 0 1.689-.123 2.304-.335v-.862c-.43.199-1.354.328-2.29.328-2.926 0-4.813-1.88-4.813-4.798 0-2.844 1.921-4.881 4.594-4.881 2.735 0 4.608 1.688 4.608 4.156 0 1.682-.554 2.769-1.416 2.769-.492 0-.772-.28-.772-.76V5.206H8.923v.834h-.11c-.266-.595-.881-.964-1.6-.964-1.4 0-2.378 1.162-2.378 2.823 0 1.737.957 2.906 2.379 2.906.8 0 1.415-.39 1.709-1.087h.11c.081.67.703 1.148 1.503 1.148 1.572 0 2.57-1.415 2.57-3.643zm-7.177.704c0-1.197.54-1.907 1.456-1.907.93 0 1.524.738 1.524 1.907S8.308 9.84 7.371 9.84c-.895 0-1.442-.725-1.442-1.914z"></path>
            </svg>
        <input type="text" class="inputField" id="username" placeholder="Username">
        </div>

    <div class="inputContainer">
        <svg class="inputIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#2e2e2e" viewBox="0 0 16 16">
        <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"></path>
        </svg>
        <input type="password" class="inputField" id="password" placeholder="Password">
    </div>


    <button id="button">LOGIN</button>
        <a class="forgotLink" href="https://wa.me/+94789331605?text=vits.lk%20ADMIN%20PANEL%20Password%20Forgotten">Forgot your password?</a>
    </form>

    <div class="fail" id="fail">

        <h1>VITS</h1>
        <span>Vester's ICT Society</span>
        
        <div class="wrapper"> 
          <img src="/img/will.gif" alt="">
        </div>

        <h2>Login Failure 
          <span id="options">
            <li>AUTHORIZED PERSONNAL ONLY</li>
            <li>Click Forgot password option to get help</li>
          </span>
        </h2>

        <div class="done-ctn">
          <button id="done" class="fail-close">OKAY</button>
        </div>
        
    </div>

    <div class="success" id="success">

        <h1>VITS</h1>
        <span>Vester's ICT Society</span>
        
        <div class="wrapper"> 
          <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52"> 
              <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/> 
              <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
          </svg>
        </div>

        <h2>LOGIN SUCCESS 
          <span>Redirecting to Admin Panel</span>
        </h2>

        <!-- <div class="done-ctn">
          <button id="done">DONE</button>
        </div> -->
        
    </div>
    
  </section>
  
  
  <h2>Update Match Info</h2>
  <input type="text" id="team1Name" placeholder="Team 1 Name">
  <input type="text" id="toss" placeholder="Toss Result">
  <input type="text" id="batter1" placeholder="Batter 1">
  <input type="text" id="batter2" placeholder="Batter 2">
  <input type="text" id="bowler" placeholder="Bowler Summary">
  <input type="text" id="runs" placeholder="Total Runs (e.g., 264/8)">
  <input type="text" id="overs" placeholder="Overs (e.g., 42 Overs)">
  <input type="text" id="extras" placeholder="Extras (e.g., 20 (NB 2, W 9, B 4, LB 5))">
  <input type="text" id="partnership" placeholder="Partnership (e.g., 37 (28))">
  <input type="text" id="last5" placeholder="Last 5 Overs (e.g., 47/2)">

  <!-- Dismissed Batters Table -->
  <div class="table-section">
    <h3>Dismissed Batters</h3>
    <div id="dismissedContainer">
      <div class="row-group">
        <input type="text" placeholder="Name">
        <input type="number" placeholder="Runs">
        <input type="number" placeholder="Balls">
        <input type="text" placeholder="Dismissal">
      </div>
    </div>
    <button onclick="addDismissedRow()">+ Add Batter</button>
  </div>

  <!-- Bowler Stats Table -->
  <div class="table-section">
    <h3>Bowler Stats</h3>
    <div id="bowlersContainer">
      <div class="row-group">
        <input type="text" placeholder="Name">
        <input type="number" placeholder="Overs">
        <input type="number" placeholder="Maidens">
        <input type="number" placeholder="Runs">
        <input type="number" placeholder="Wickets">
        <input type="number" step="0.01" placeholder="Economy">
      </div>
    </div>
    <button onclick="addBowlerRow()">+ Add Bowler</button>
  </div>

  <button onclick="updateScore()" id="update-score">Update Score</button>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="./script.js"></script>
</body>
</html>
